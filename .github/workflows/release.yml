# 打 tag 发版。构建只发生在这里 —— 本机不产出、也拿不到发布密钥,
# 所以「这个 APK 是从这份源码编出来的」这句话有据可查。
#
# Windows 安装包由 job `desktop` 在 Windows runner 上构建,产物交给 job `release`,
# 与 APK 一起进校验和、两份构建来源证明和同一个草稿 release。
#
# 两份构建来源证明:job `release` 里的 attest-build-provenance(GitHub 自己核,快),
# 以及 job `provenance` 走 slsa-github-generator 出的 SLSA Build L3 证明。后者跑在
# 隔离的可复用 workflow 里,拿不到这个仓库的构建脚本和签名密钥 —— 这正是 L2 与 L3
# 的区别所在。
#
# 触发:推一个 `v` 开头的 tag,例如 `git tag v0.1.0 && git push origin v0.1.0`。
# 版本号取自 tag(去掉 `v`),传给 Gradle 的 -PbilbyVersion,不写在源码里。
#
# 需要两个仓库 Secret:
#   BILBY_KEYSTORE_BASE64  —— 签名库的 base64
#   BILBY_KEYSTORE_PASSWORD / BILBY_KEY_ALIAS / BILBY_KEY_PASSWORD
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # 构建来源证明要签名,需要这两项。它是「CI 构建」这句话的凭据本身。
  id-token: write
  attestations: write

jobs:
  # Windows x64 的 MSI、免安装 zip 与应用内更新的两个附件。只产出,不发布:上传由 release
  # 统一做,校验和与证明才能覆盖全部附件。代价是它失败时整个发版停下,而不是只发出 APK;
  # 发的是草稿,重跑失败的 job 即可,不会出现缺了桌面包却已公开的 release。
  desktop:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Zulu 而不是 Temurin:Temurin 25 的发行包不带 jmods,release 变体的 ProGuard 读不到
      # java.lang.Object,jlink 也无从取模块。打包工具链在 desktop/build.gradle.kts 里按 Azul 25
      # 取,Gradle 跑在这份 JDK 上,即可直接认出。
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      # 停在 v5 的理由见下面 release job 的同名步骤。
      - uses: gradle/actions/setup-gradle@v5

      - name: Derive version from tag
        id: version
        shell: bash
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # release job 在 Linux 上也跑这组测试;这里再跑一遍,是因为桌面端只发 Windows,
      # 路径与原生库的问题只在这里暴露。
      - name: Test
        # 参数要加引号:这一步跑在 PowerShell 里,它把 -PbilbyVersion=0.15.0 在点号处拆成
        # -PbilbyVersion=0 和 .15.0 两个参数,构建拿到的版本号是 0,MSI 拒收。
        run: ./gradlew.bat :shared:desktopTest "-PbilbyVersion=${{ steps.version.outputs.name }}"

      # WiX 由 Compose 插件自行下载,不必另装。清单与 app.zip 在同一次调用里生成,
      # 与 MSI 取自同一份应用目录。MSI 未签名,安装时 SmartScreen 会提示。
      - name: Build
        run: ./gradlew.bat :desktop:packageReleaseMsi :desktop:packageReleaseUpdate "-PbilbyVersion=${{ steps.version.outputs.name }}"

      # 打包出的类逐个让 JVM 校验一遍。打包流程改写过的字节码可能校验不过,而那只在装上之后
      # 进到某一页才崩,gradle run 与单测都走不到(见 desktop/package/VerifyClasses.java)。
      - name: Verify classes
        run: java -Xverify:all desktop/package/VerifyClasses.java desktop/build/compose/binaries/main-release/app/Bilby/app

      - name: Collect artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.name }}'
          $binaries = 'desktop/build/compose/binaries/main-release'
          $appDir = "$binaries/app/Bilby"
          if (-not (Test-Path "$appDir/Bilby.exe")) { throw "缺少 $appDir/Bilby.exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 免安装版:整个应用目录打包,解压即得 Bilby 目录。
          Compress-Archive -Path $appDir -DestinationPath "dist/bilby-windows-x64-$version.zip"
          # jpackage 按包名命名 MSI,改成与 APK 同一套规则,一眼看出平台与架构。
          $msi = Get-ChildItem "$binaries/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw 'packageReleaseMsi 没有产出 MSI' }
          Copy-Item $msi.FullName "dist/bilby-windows-x64-$version.msi"
          # 应用内更新的 files.json 与 app.zip,名字由 packageReleaseUpdate 定好。
          Copy-Item "$binaries/update/*" dist/
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [desktop]
    runs-on: ubuntu-latest
    outputs:
      # 交给下面那个隔离的 provenance job。传的是摘要清单的句柄不是产物:generator 不信任、
      # 也不需要拿到产物本身。
      subjects-as-file: ${{ steps.subjects.outputs.handle }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # compileOptions 是 21,这里不能更低。
          java-version: "21"

      # 停在 v5,不跟到 v6。v6 把缓存拆成了闭源的 gradle-actions-caching,升上去
      # 等于接受 Gradle 的商业 Terms of Use —— 这个仓库是 GPL-3.0,不为了一个
      # 构建缓存把一份商业条款引进发布链路。v5 与 v4 的差别只是 Node 24。
      - uses: gradle/actions/setup-gradle@v5

      - name: Derive version from tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 密钥只在这一步落到磁盘,用完随 runner 一起销毁。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BILBY_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bilby.jks"

      # 单测都在 :shared,见 ci.yml 的同名步骤。
      - name: Test
        run: ./gradlew :shared:testAndroidHostTest :shared:desktopTest -PbilbyVersion=${{ steps.version.outputs.name }}

      - name: Build
        env:
          BILBY_KEYSTORE: ${{ runner.temp }}/bilby.jks
          BILBY_KEYSTORE_PASSWORD: ${{ secrets.BILBY_KEYSTORE_PASSWORD }}
          BILBY_KEY_ALIAS: ${{ secrets.BILBY_KEY_ALIAS }}
          BILBY_KEY_PASSWORD: ${{ secrets.BILBY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PbilbyVersion=${{ steps.version.outputs.name }}

      # 桌面产物先落进 dist,下一步的校验和与证明摘要才会一并算上。
      - uses: actions/download-artifact@v8
        with:
          name: desktop-dist
          path: dist

      # 装错架构会装不上,所以文件名必须一眼看出是哪个变体。
      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p dist
          version="${{ steps.version.outputs.name }}"
          for apk in app/build/outputs/apk/release/*.apk; do
            variant=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/bilby-$version-$variant.apk"
          done
          # R8 的 mapping 一起发:release 崩溃栈是混淆过的,没有它谁也读不了用户贴的日志。
          cp app/build/outputs/mapping/release/mapping.txt "dist/bilby-$version-mapping.txt"

          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

          # SLSA generator 要的是 base64 过的 `sha256sum` 输出。只列会被安装或执行的文件:
          # APK、MSI、免安装 zip 与应用内更新解开的 app.zip。files.json 与 mapping 不在其列,
          # 由 SHA256SUMS.txt 覆盖。
          #
          # **写进文件,不走 job 输出。** 这一长串 base64 里偶然含有某个较短 secret 的值时,
          # Actions 会以"可能含 secret"为由丢掉整条输出,generator 收到空值而失败 —— v0.15.0
          # 加了桌面附件之后就撞上了。文件放在 dist 外面,免得被当成附件发出去。
          (cd dist && sha256sum *.apk *.msi *.zip | base64 -w0) > slsa-subjects.b64

      # 把上面那个文件交给 provenance job,job 输出里只传一个句柄(见 generator 文档的
      # base64-subjects-as-file)。
      - name: Share SLSA subjects
        id: subjects
        uses: slsa-framework/slsa-github-generator/actions/generator/generic/create-base64-subjects-from-file@v2.1.0
        with:
          path: slsa-subjects.b64

      # 证明这些文件确实由这个 workflow、从这个 commit 构建。桌面产物出自 desktop job,
      # 同属这次 workflow run,证明里记录的来源相同。
      # 校验:gh attestation verify bilby-<版本>-<变体>.apk --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.apk
            dist/*.msi
            dist/*.zip

      # 附件不分先后上传。桌面端的应用内更新以 files.json 为准判断新版是否可用,本该最后
      # 上传;这里发的是草稿,公开之前 releases/latest 看不到它,公开时附件已经齐全。
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
          # 「安装」「校验」两个标题逐字对应应用里的 DownloadPageSections(ui/update/StartupUpdate.kt):
          # 更新弹窗读到这两个标题就截断,不画下载页的内容。改标题要两边一起改。
          body: |
            ## 安装

            | 附件 | 说明 |
            |---|---|
            | `universal.apk` | Android 通用安装包 |
            | `arm64-v8a.apk` 等 | 按 CPU 架构拆分的 Android 安装包，体积较小 |
            | `.msi` | Windows 安装包，安装至当前用户目录，支持应用内更新 |
            | `.zip` | Windows 便携版 |
            | `-files.json`、`-app.zip` | 供应用内更新使用 |

            Windows 安装包未经代码签名，首次运行时 SmartScreen 会拦截，选择「更多信息」→「仍要运行」。

            ## 校验

            附件均由 GitHub Actions 基于本 tag 构建，APK 经过签名。

            - 校验和：`SHA256SUMS.txt`
            - 构建来源：`gh attestation verify <文件> --repo ${{ github.repository }}`
            - SLSA Build L3：`multiple.intoto.jsonl`

              ```
              slsa-verifier verify-artifact <文件> --provenance-path multiple.intoto.jsonl --source-uri github.com/${{ github.repository }}
              ```

            - 混淆映射：`mapping.txt`，用于还原 Android 崩溃堆栈

  # SLSA Build Level 3。
  #
  # 上面那个 `attest-build-provenance` 已经能证明"这些文件由这个 workflow 从这个 commit
  # 构建",但它和构建跑在同一个 job 里 —— 按 SLSA 的说法,构建过程能影响到生成证明的过程,
  # 所以只到 L2。这个 job 用 slsa-github-generator 的可复用 workflow:它在自己的
  # 上下文里跑,拿不到本仓库的构建脚本,也拿不到签名密钥,证明因此不可伪造(L3)。
  #
  # 两份证明都留着,它们回答的不是同一个问题,验证方式也不同:
  #   gh attestation verify <文件> --repo <owner>/<repo>          # 快,GitHub 自己核
  #   slsa-verifier verify-artifact <文件>   #     --provenance-path multiple.intoto.jsonl   #     --source-uri github.com/<owner>/<repo>                    # 按 SLSA 规范核
  provenance:
    needs: [release]
    permissions:
      # 证明要签名,签名要 OIDC 身份。
      id-token: write
      contents: write
      # generator 要读本次 workflow run 的元数据来填 provenance。
      actions: read
    # 这个 job 的日志里有一片 "Node.js 20 is deprecated" —— **来自 generator 内部**
    # (`detect-workflow-js`、`compute-sha256`、它自己 pin 的 checkout),不是本仓库能改的:
    # v2.1.0 已经是上游最新版。runner 目前会把它们强制跑在 Node 24 上,只是告警。
    # 本仓库自己引的 action 都已在 Node 24 一代。
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects-as-file: ${{ needs.release.outputs.subjects-as-file }}
      # **不让 generator 自己上传。** 它按 tag 查 release,而 GitHub 的按-tag 接口看不到
      # 草稿;上面那个 job 发的正是草稿,于是它查不到、转而**新建并公开发布**一个同名
      # release,里面只有一份 .intoto.jsonl,正文空白。v0.7.0 上真的发生过:发布页上
      # 一个 tag 挂了两个 release,公开的那个还是空的。
      #
      # 改成让它把证明留作 workflow 产物,由下面那个 job 按 release id 挂到草稿上。
      upload-assets: false

  # 把 SLSA 证明挂到上面那个草稿 release 上。
  #
  # 按 **release id** 找,不按 tag:`gh release view <tag>` 和 REST 的 releases/tags/<tag>
  # 都不返回草稿,只有列表接口看得到它。
  attach-provenance:
    needs: [release, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Attach provenance to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.provenance.outputs.provenance-name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          if [ -z "$id" ]; then
            echo "找不到 $GITHUB_REF_NAME 的 release" >&2
            exit 1
          fi
          # 用 uploads 主机传二进制:gh api 走的是 api.github.com,那台不收附件。
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$NAME" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$NAME" \
            > /dev/null
