# 单测。改动落到 main 或者提出 PR 时各跑一次。
#
# 存在的理由是发版链路太靠后:此前唯一跑过测试的地方是打 tag 那一刻(见 release.yml),
# 攒了几十个 commit 才在发版时报错,要从中挑出是哪一条引起的,比当场知道贵得多。
#
# **只跑测试,不出包。** 打包由 release.yml 做,而 tag 通常紧跟着 main 推,两边都编一遍
# 等于同一份代码在 GitHub 的机器上过两次 R8。编译错误测试任务本来就会先撞上,拿不到的
# 只有 release 独有的那类失败(keep 规则、资源 shrink),那些留给发版时的构建。
name: CI

on:
  push:
    branches: [main]
    # 只改文档不值得跑一次。
    paths-ignore:
      - "**.md"
      - ".github/badges/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".github/badges/**"
  workflow_dispatch:

# 连着推几个 commit 时只留最后一次。中间那些的结果没人看,却在排队占位。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # compileOptions 是 21,这里不能更低。
          java-version: "21"

      # 停在 v5 的理由见 release.yml。
      - uses: gradle/actions/setup-gradle@v5

      # 单测都在 :shared。Android 目标的宿主测试(含 Robolectric)与桌面 JVM 测试各跑一遍,
      # 公共代码的用例两边都会执行。:app 只是打包入口,没有单测。
      - name: Test
        run: ./gradlew :shared:testAndroidHostTest :shared:desktopTest

      # 失败时要能看到是哪个用例、断言差在哪,光看日志行不够。
      - name: Upload test report
        if: failure()
        # upload 与 download 的大版本号不同步:download 已经到 v8,upload 最新是 v7。
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: shared/build/reports/tests
          retention-days: 7
