[versions]
agp = "9.3.1"
# kotlin / ksp 同时出现在根 build.gradle.kts 的 buildscript classpath 里,改这里要同步改那边
kotlin = "2.4.10"
ksp = "2.3.11"

coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.07.01"
navigation3 = "1.1.5"

media3 = "1.10.1"
room = "2.8.4"
datastore = "1.2.1"
work = "2.12.0"
ktor = "3.5.2"
serialization = "1.11.0"
coil = "3.5.0"
zxing = "3.5.4"

junit = "4.13.2"
# Media3 的 MediaSource 在准备与释放的每一步上都要一个 Looper,普通 JVM 单测里没有。
robolectric = "4.16"
kotlinxCoroutines = "1.11.0"

# 桌面端(:player-desktop)。停在 1.12.1:它与 mediamp 0.5.0 编译时同为 skiko 0.150.1。
# 1.13.0-alpha01 的 skiko 0.152 删掉了 ContextHandler,DirectContext 改挂在
# Direct3DRedrawer.context 上,mediamp 反射取 contextHandler 失败,画面全黑。
# 1.12.1 配 material3 1.5.0-alpha22,比 Android 端 BOM 的 alpha25 旧。按 app 字节码逐条核对,
# 差距只有两处:alpha22 没有不带 onClick 的 SegmentedListItem 重载(ProfileScreen 预览行),
# MediumFlexibleTopAppBar 在 alpha22 仍需 ExperimentalMaterial3ExpressiveApi。
composeMultiplatform = "1.12.1"
# 与 composeMultiplatform 配套的几条 JetBrains 多平台线。Android 目标上它们各自重定向到
# androidx 的同名构件,实际版本由 :app 的 BOM 与上面的 androidx 版本抬高。
composeMultiplatformMaterial3 = "1.12.0-alpha03"
composeMultiplatformIcons = "1.7.3"
navigation3Multiplatform = "1.1.2"
lifecycleMultiplatform = "2.11.0"
sqlite = "2.6.2"
# 桌面播放后端。它的运行时包带打过 D3D11 render API 补丁的 libmpv,见 player-desktop/build.gradle.kts。
mediamp = "0.5.0"
# 桌面全屏要直接调 Win32(见 desktop 的 WindowsFullscreen)。跟 mediamp 传递带进来的版本一致。
jna = "5.13.0"

# 弹幕引擎,独立仓库。开发期走 composite build(settings.gradle.kts),这个版本号只在
# 脱离 composite build 从仓库解析时才生效。
tdanmaku = "0.2.1"

[libraries]
tdanmaku = { module = "dev.nihildigit:tdanmaku", version.ref = "tdanmaku" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose：版本由 BOM 统一,单个依赖不写版本号。
# 走 alpha 线是为了 material3 1.5.0：ButtonGroup / SplitButton / ToggleButton / FAB menu /
# floating toolbar / wavy progress 在这一版转正,motion scheme 也从 experimental 毕业,
# 稳定线的 1.4.0 里这些要么没有要么还是 experimental。
# 2026.07.01 pin 的是 ui/foundation 1.12.0-rc01 + material3 1.5.0-alpha25 + icons 1.7.8。
androidx-compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }

# Navigation 3：backstack 就是自己的 SnapshotStateList
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
# 直播流走 HLS-fmp4：Media3 原生支持，而 FLV 那条要靠 progressive 里的 FlvExtractor 撑无限流。
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
# exoplayer 已经传递带进来了，显式声明是因为我们直接用了它的 FlacStreamMetadata
# （见 PlayerFactory 的 flacMaxFrameSize）。用谁的 API 就声明谁。
androidx-media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# 断网期间没发出去的心跳,联网后补发(offline/HeartbeatFlushWorker.kt)。要能跨过进程死亡等到联网,
# 这件事只有系统调度得了。
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# 直播弹幕长连接。不另引 OkHttp 直接用它的 WebSocket：app 的 HTTP 栈已经是 Ktor + OkHttp 引擎，
# 再开一条独立的连接栈等于两套超时、两套代理设置。
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# 只用来把登录二维码的 url 编码成矩阵,不引 zxing-android-embedded(那是扫码用的)
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

compose-mp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-mp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-mp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-mp-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "composeMultiplatform" }
compose-mp-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-mp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
compose-mp-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMultiplatformIcons" }
compose-mp-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
compose-mp-resources ={ module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
navigation3-mp-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3Multiplatform" }
lifecycle-mp-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleMultiplatform" }
lifecycle-mp-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleMultiplatform" }
lifecycle-mp-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleMultiplatform" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
mediamp-mpv = { module = "org.openani.mediamp:mediamp-mpv", version.ref = "mediamp" }
mediamp-mpv-runtime-windows-x64 = { module = "org.openani.mediamp:mediamp-mpv-runtime-windows-x64", version.ref = "mediamp" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
room = { id = "androidx.room", version.ref = "room" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
