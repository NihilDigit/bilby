[versions]
agp = "9.5.1"
# kotlin / ksp 同时出现在根 build.gradle.kts 的 buildscript classpath 里,改这里要同步改那边
kotlin = "2.4.21"
ksp = "2.3.14"

coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.11.00"
navigation3 = "1.2.0"

media3 = "1.11.1"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
ktor = "3.6.1"
serialization = "1.13.0"
coil = "3.6.3"
zxing = "3.5.4"

junit = "4.13.2"
# Media3 的 MediaSource 在准备与释放的每一步上都要一个 Looper,普通 JVM 单测里没有。
robolectric = "4.18.1"
kotlinxCoroutines = "1.11.0"

# 桌面端与 Android 统一在 CMP 1.13.0-rc01:Android 端由 JetBrains .module 重定向到
# androidx.compose.*:1.13.0-rc01 与 material3:1.5.0-rc01,与下方 compose-bom-beta 2026.11.00 一致;
# 桌面端使用 Skiko 0.156.1,视频表面由 Bilby 自己的 BilbyMpvVideoSurface 经 FFM 读取
# Direct3DRenderer 并直接调用 mediamp 0.5.3 的 MPVHandleDesktop D3D11/readback JNI,不再受制于
# mediamp-mpv-desktop 自带表面对旧 Skiko 0.150 Direct3DRedrawer 的反射。
composeMultiplatform = "1.13.0-rc01"
composeGradlePlugin = "1.13.0-rc01"
composeMultiplatformMaterial3 = "1.13.0-rc01"
composeMultiplatformIcons = "1.7.3"
navigation3Multiplatform = "1.2.0"
# 列表与详情并排(ListDetailSceneStrategy),1.3.0 稳定版在 Android 与桌面端完全一致。
composeMultiplatformAdaptive = "1.3.0"
lifecycleMultiplatform = "2.11.0"
sqlite = "2.7.1"
# 桌面播放后端。它的运行时包带打过 D3D11 render API 补丁的 libmpv 与 mediampv.dll。
mediamp = "0.5.3"
# 桌面全屏与安装器检测直调 Win32(WindowsFullscreen / WindowsInstaller)。
jna = "5.19.1"
# 应用内差分更新只用它带的 libzstd 原生库,解码经 FFM 直调 C API(update/ZstdPatch.kt)。
zstdJni = "1.5.7-28"
# Windows 的触摸与笔输入接进 Compose(desktop 的 WindowsCaption)。独立仓库 NihilDigit/compose-windows-touch。
windowsTouch = "0.1.0"

# 弹幕引擎,独立仓库。开发期走 composite build(settings.gradle.kts),这个版本号只在
# 脱离 composite build 从仓库解析时才生效。
tdanmaku = "0.2.2"

[libraries]
tdanmaku = { module = "dev.nihildigit:tdanmaku", version.ref = "tdanmaku" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose：版本由 BOM 统一,单个依赖不写版本号。
# 走 beta 线是为了 material3 1.5.0-rc01：ButtonGroup / SplitButtonLayout / ToggleButton /
# FAB menu / floating toolbar / wavy progress 等 M3 Expressive API,同时与 CMP 1.13.0-rc01 对齐。
# 2026.11.00 pin 的是 ui/foundation 1.13.0-rc01 + material3 1.5.0-rc01 + icons 1.7.8 + adaptive 1.3.0。
androidx-compose-bom = { module = "androidx.compose:compose-bom-beta", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }

# Navigation 3：backstack 就是自己的 SnapshotStateList
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3" }

androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
# 直播流走 HLS-fmp4：Media3 原生支持，而 FLV 那条要靠 progressive 里的 FlvExtractor 撑无限流。
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
# exoplayer 已经传递带进来了，显式声明是因为我们直接用了它的 FlacStreamMetadata
# （见 PlayerFactory 的 flacMaxFrameSize）。用谁的 API 就声明谁。
androidx-media3-extractor = { module = "androidx.media3:media3-extractor", version.ref = "media3" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# 断网期间没发出去的心跳,联网后补发(offline/HeartbeatFlushWorker.kt)。要能跨过进程死亡等到联网,
# 这件事只有系统调度得了。
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# 直播弹幕长连接。不另引 OkHttp 直接用它的 WebSocket：app 的 HTTP 栈已经是 Ktor + OkHttp 引擎，
# 再开一条独立的连接栈等于两套超时、两套代理设置。
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# 只用来把登录二维码的 url 编码成矩阵,不引 zxing-android-embedded(那是扫码用的)
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

compose-mp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-mp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-mp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-mp-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "composeMultiplatform" }
compose-mp-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-mp-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
compose-mp-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "composeMultiplatformIcons" }
compose-mp-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
compose-mp-resources ={ module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
navigation3-mp-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3Multiplatform" }
adaptive-mp-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "composeMultiplatformAdaptive" }
lifecycle-mp-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleMultiplatform" }
lifecycle-mp-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleMultiplatform" }
lifecycle-mp-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleMultiplatform" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinxCoroutines" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
mediamp-mpv = { module = "org.openani.mediamp:mediamp-mpv", version.ref = "mediamp" }
# mpv 运行库与 Compose 的桌面运行库按构建机的架构取(x64 或 arm64),坐标在 desktop/build.gradle.kts
# 里拼出,版本目录只提供版本号。
# 不带 classifier 的 jar 捆了二十个平台的原生库,按平台的只捆一个,类是同一套。
# classifier 按构建机的架构在引用处给出(win_amd64、win_aarch64),版本目录写不了它。
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
windows-touch = { module = "dev.nihildigit:compose-windows-touch", version.ref = "windowsTouch" }

junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
room = { id = "androidx.room", version.ref = "room" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeGradlePlugin" }
