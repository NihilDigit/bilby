org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin 编译跑在**另一个 JVM**(Kotlin daemon)里,上面那个 -Xmx4g 给的是 Gradle daemon,
# 管不到它。不显式给堆时它用自己的默认值,大项目上会 GC 抖 —— 表现是占着一个核不放、
# 整体很慢,而不是报内存不足。
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# 只有一个 :app 模块,parallel 并行的是模块之间,这里没有可并行的对象;留着是为了将来
# 拆模块时不用再想起它。串行链(KSP → Kotlin → R8)才是耗时的大头。
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
