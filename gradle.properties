org.gradle.jvmargs=-Xmx4g -Xms512m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin 编译跑在**另一个 JVM**(Kotlin daemon)里,上面那个 -Xmx4g 给的是 Gradle daemon,
# 管不到它。显式收紧上限并用 ParallelGC,避免与 Gradle daemon 或跨项目 daemon 叠加触发换页。
kotlin.daemon.jvmargs=-Xmx3g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC

# 并行与缓存开关
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.incremental=true
ksp.ic.in-memory.enable=true

android.useAndroidX=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
