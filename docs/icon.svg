<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!--
    README 用的图标。路径与 app/src/main/res/drawable/ic_launcher_foreground.xml 逐字符相同,
    改路径时两边都要改。但有三处**有意不同**,同步时别一并搬过来:

    - 这里自带圆角底。装到机器上时圆角由 launcher 的遮罩决定,应用不指定。
    - 内容不套那一层 0.75 缩放。launcher 图标缩小是为了和同屏其他应用的图标对齐视觉重量,
      而这一张在 README 里单独出现,没有可对齐的对象,缩了只会显得小气。
    - 画布按 108 直接装内容,不留 launcher 那圈安全区。
  -->
  <rect width="108" height="108" rx="24" fill="#4A5C92"/>
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M39,40 H54.5 A10.5,10.5 0 0 1 54.5,61 H56.5 A11.5,11.5 0 0 1 56.5,84 H39 Z
           M56,46.1 A2.4,2.9 0 0 1 56,51.9 A2.4,2.9 0 0 1 56,46.1 Z
           M57.75,47.9 A0.85,0.85 0 0 1 56.05,47.9 A0.85,0.85 0 0 1 57.75,47.9 Z"/>
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M45,41 C43,35.5 41.5,32 41,28"/>
    <path d="M56,41 C58.5,35.5 60.8,31.5 62,28"/>
  </g>
</svg>
