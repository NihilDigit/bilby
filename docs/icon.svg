  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M45,41 C43,35.5 41.5,32 41,28"/>
    <path d="M56,41 C58.5,35.5 60.8,31.5 62,28"/>
